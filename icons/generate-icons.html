<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WishPop Icon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    h1 { color: #667eea; }
    .icon-preview {
      display: flex;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    .icon-item {
      text-align: center;
    }
    canvas {
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .instructions {
      background: #f9fafb;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>WishPop Icon Generator</h1>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Click "Generate Icons" to create placeholder icons</li>
      <li>Click "Download All" to save all icon sizes as PNG files</li>
      <li>Replace these placeholder icons with your branded icons</li>
    </ol>
  </div>

  <button onclick="generateIcons()">Generate Icons</button>
  <button onclick="downloadAll()">Download All</button>

  <div class="icon-preview" id="iconPreview"></div>

  <script>
    const sizes = [16, 32, 48, 128];
    const canvases = {};

    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      canvas.width = size;
      canvas.height = size;

      // Create gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');

      // Draw rounded rectangle background
      const radius = size * 0.1875; // 24/128
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();

      // Draw heart
      ctx.fillStyle = 'white';
      const scale = size / 128;
      ctx.save();
      ctx.scale(scale, scale);

      // Heart path
      ctx.beginPath();
      ctx.moveTo(64, 89.23);
      ctx.bezierCurveTo(64, 89.23, 86.84, 67.39, 86.84, 67.39);
      ctx.lineTo(87.9, 66.33);
      ctx.bezierCurveTo(93.78, 60.45, 93.78, 50.89, 87.9, 44.61);
      ctx.bezierCurveTo(82.02, 38.73, 72.46, 38.73, 66.12, 44.61);
      ctx.lineTo(64, 45.67);
      ctx.lineTo(62.94, 44.61);
      ctx.bezierCurveTo(56.66, 38.73, 47.1, 38.73, 41.16, 44.61);
      ctx.bezierCurveTo(35.28, 50.49, 35.28, 60.45, 41.16, 66.33);
      ctx.lineTo(42.22, 67.39);
      ctx.lineTo(64, 89.23);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function generateIcons() {
      const preview = document.getElementById('iconPreview');
      preview.innerHTML = '';

      sizes.forEach(size => {
        const container = document.createElement('div');
        container.className = 'icon-item';

        const canvas = document.createElement('canvas');
        drawIcon(canvas, size);
        canvases[size] = canvas;

        const label = document.createElement('div');
        label.textContent = `${size}x${size}px`;
        label.style.marginTop = '10px';
        label.style.fontWeight = '600';

        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = 'Download';
        downloadBtn.onclick = () => downloadIcon(size);

        container.appendChild(canvas);
        container.appendChild(label);
        container.appendChild(downloadBtn);
        preview.appendChild(container);
      });
    }

    function downloadIcon(size) {
      const canvas = canvases[size];
      if (!canvas) return;

      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon${size}.png`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    function downloadAll() {
      sizes.forEach((size, index) => {
        setTimeout(() => downloadIcon(size), index * 500);
      });
    }

    // Auto-generate on load
    window.onload = generateIcons;
  </script>
</body>
</html>
